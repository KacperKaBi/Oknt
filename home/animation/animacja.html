<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Okn't</title>

<style>
/* -----------------------------------------------------------
   ROOT THEME — OKN'T DARK AESTHETIC
----------------------------------------------------------- */
:root {
    --bg1: #000000;
    --bg2: #111111;
    --bg3: #050505;
}

/* -----------------------------------------------------------
   GLOBAL RESET
----------------------------------------------------------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    height: 100vh;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
}

/* -----------------------------------------------------------
   HEADER — IDENTYCZNY NA KAŻDEJ PODSTRONIE
----------------------------------------------------------- */
header {
    width: 100%;
    padding: 14px 30px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 20;
    backdrop-filter: blur(14px);
    background: rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 0 40px rgba(255,255,255,0.05);

    display: flex;
    align-items: center;
    justify-content: center;
}

.header-left {
    position: absolute;
    left: 30px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-left img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 12px rgba(255,255,255,0.25);
}

.header-left .title {
    font-size: 22px;
    letter-spacing: 0.05em;
    opacity: 0.9;
    color: white;
}

.nav {
    display: flex;
    gap: 26px;
}

.nav a {
    color: white;
    text-decoration: none;
    font-size: 19px;
    opacity: 0.75;
    transition: 0.25s;
    padding: 6px 10px;
    border-radius: 8px;
}

.nav a:hover {
    opacity: 1;
    background: rgba(255,255,255,0.12);
    transform: translateY(-2px);
}

/* -----------------------------------------------------------
   BACKGROUND GLOW
----------------------------------------------------------- */
.bg-glow {
    position: fixed;
    width: 1100px;
    height: 1100px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    filter: blur(140px);
    animation: glowMove 16s infinite alternate ease-in-out;
    pointer-events: none;
    z-index: 0;
}

@keyframes glowMove {
    0% { transform: translate(-200px, -200px); }
    50% { transform: translate(200px, -100px); }
    100% { transform: translate(200px, 200px); }
}

/* -----------------------------------------------------------
   STARS
----------------------------------------------------------- */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    opacity: 0.18;
    border-radius: 50%;
    animation: blink 3s infinite ease-in-out;
}

@keyframes blink {
    0% { opacity: 0.1; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-6px); }
    100% { opacity: 0.1; transform: translateY(0); }
}

/* -----------------------------------------------------------
   COMING SOON TEXT
----------------------------------------------------------- */
.coming-soon {
    position: relative;
    z-index: 5;
    text-align: center;
    color: white;
    margin-top: 180px; /* żeby nie wchodziło pod nagłówek */
    animation: float 4s infinite ease-in-out;
}

.coming-soon h1 {
    font-size: 42px;
    letter-spacing: 2px;
    opacity: 0.9;
}

.coming-soon p {
    margin-top: 10px;
    font-size: 18px;
    opacity: 0.6;
}

/* -----------------------------------------------------------
   FLOAT ANIMATION
----------------------------------------------------------- */
@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}

/* -----------------------------------------------------------
   NOISE OVERLAY
----------------------------------------------------------- */
.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.08;
    z-index: 2;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='noStitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="header-left">
        <img src="logo.png">
        <div class="title">Okn't</div>
    </div>

    <nav class="nav">
        <a href="../home.html">Strona Główna</a>
        <a href="../botoknt/mainbot.html">Bot Okn't</a>
        <a href="../game/gra.html">Gra</a>
        <a href="../discord/discord.html">Discord</a>
        <a href="../blog/blog.html">Blog</a>
        <a href="../shop/sklep.html">Sklep</a>
        <a href="../contact/kontakt.html">Kontakt</a>
    </nav>
</header>

<!-- autoplay fix -->
<audio id="bgm" src="../music.mp3" autoplay loop muted></audio>

<div class="bg-glow"></div>
<div class="stars"></div>
<div class="noise"></div>

<div class="coming-soon">
    <h1>Strona jest w trakcie tworzenia.</h1>
    <p>Wróć tu za jakiś czas.</p>
</div>

<script>
/* -----------------------------------------------------------
   GENERATE STARS
----------------------------------------------------------- */
const starsContainer = document.querySelector(".stars");
for (let i = 0; i < 90; i++) {
    const s = document.createElement("span");
    s.style.top = Math.random()*100 + "%";
    s.style.left = Math.random()*100 + "%";
    s.style.animationDuration = (2 + Math.random()*2) + "s";
    s.style.animationDelay = Math.random()*2 + "s";
    starsContainer.appendChild(s);
}

/* -----------------------------------------------------------
   MUSIC AUTOPLAY FIX
----------------------------------------------------------- */
setTimeout(() => {
    const bgm = document.getElementById("bgm");
    bgm.muted = false;
    bgm.volume = 0.45;
    bgm.play().catch(()=>{});
}, 500);
</script>

</body>
</html>
