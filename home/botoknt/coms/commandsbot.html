<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okn't Bot – Komendy</title>

<style>
/* ============================================================
   GLOBAL STYLE
   ============================================================ */

:root {
    --bg1: #000000;
    --bg2: #0d0d0d;
    --glass: rgba(255,255,255,0.04);
    --line: rgba(255,255,255,0.12);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    font-family: 'Segoe UI', sans-serif;
    color: white;
    overflow: hidden;
}

/* ============================================================
   HEADER
   ============================================================ */

header {
    width: 100%;
    padding: 14px 30px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 20;
    backdrop-filter: blur(14px);
    background: rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
}

.header-left {
    position: absolute;
    left: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-left img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
}

.header-left .title {
    font-size: 22px;
}

.nav {
    display: flex;
    gap: 26px;
}

.nav a {
    color: white;
    text-decoration: none;
    font-size: 19px;
    opacity: 0.75;
    transition: 0.25s;
    padding: 6px 10px;
    border-radius: 8px;
}

.nav a:hover {
    opacity: 1;
    background: rgba(255,255,255,0.12);
}

/* ============================================================
   PAGE LAYOUT
   ============================================================ */

.page {
    margin-top: 140px;
    display: flex;
    height: calc(100vh - 160px);
    max-width: 1600px;
    margin-left: auto;
    margin-right: auto;
    gap: 40px;
    padding: 20px;
}

/* ============================================================
   SIDEBAR
   ============================================================ */

.sidebar {
    width: 260px;
    background: var(--glass);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    height: 100%;
    backdrop-filter: blur(12px);
    overflow-y: auto;
}

.sidebar h2 {
    font-size: 22px;
    margin-bottom: 16px;
}

.category {
    padding: 10px 12px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 15px;
}

.category:hover {
    background: rgba(255,255,255,0.12);
}

.category.active {
    background: rgba(255,255,255,0.2);
}

/* ============================================================
   COMMAND LIST
   ============================================================ */

.commands {
    flex: 1;
    height: 100%;
    overflow-y: auto;
    padding-right: 10px;
}

.commands-description {
    font-size: 15px;
    opacity: 0.7;
    margin-bottom: 12px;
}

.search-box {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.08);
    color: white;
    margin-bottom: 16px;
}

/* ============================================================
   ULTRA-KOMPAKTOWE KAFELKI
   ============================================================ */

.command-box {
    padding: 6px 2px;
    border-bottom: 1px solid var(--line);
}

.command-name {
    font-size: 14px;
    font-weight: 600;
}

.command-desc {
    opacity: 0.65;
    font-size: 12px;
    margin-top: 2px;
    line-height: 1.2;
}

/* ============================================================
   FOOTER
   ============================================================ */

footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 14px;
    text-align: center;
    background: rgba(255,255,255,0.04);
    border-top: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png">
        <div class="title">Okn't</div>
    </div>

    <nav class="nav">
        <a href="index.html">Strona Główna</a>
        <a href="bot.html">Bot Okn't</a>
        <a href="commands.html">Komendy</a>
        <a href="game.html">Gra</a>
        <a href="discord.html">Discord</a>
        <a href="blog.html">Blog</a>
        <a href="animacja.html">Animacja</a>
        <a href="sklep.html">Sklep</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>
</header>

<div class="page">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Kategorie</h2>

        <div class="category active" data-cat="all">Wszystkie</div>
        <div class="category" data-cat="moderation">Moderacja</div>
        <div class="category" data-cat="economy">Ekonomia</div>
        <div class="category" data-cat="fun">Zabawa</div>
        <div class="category" data-cat="music">Muzyka</div>
        <div class="category" data-cat="utility">Narzędzia</div>
    </div>

    <!-- COMMAND LIST -->
    <div class="commands">

        <div class="commands-description">
            Lista wszystkich komend bota Okn't.  
            Wybierz kategorię lub użyj wyszukiwarki.
        </div>

        <input type="text" class="search-box" placeholder="Szukaj komendy...">

        <div id="command-container"></div>

    </div>
</div>

<footer>
    © 2024 Okn't Studio — Komendy Bota
</footer>

<script>
/* GENEROWANIE 100 PLACEHOLDERÓW */
const container = document.getElementById("command-container");

for (let i = 1; i <= 100; i++) {
    container.innerHTML += `
        <div class="command-box" data-cat="economy">
            <div class="command-name">komenda${i}</div>
            <div class="command-desc">Opis komendy numer ${i}.</div>
        </div>
    `;
}

/* FILTROWANIE KATEGORII */
const categories = document.querySelectorAll(".category");
const commands = document.getElementsByClassName("command-box");

categories.forEach(cat => {
    cat.addEventListener("click", () => {
        categories.forEach(c => c.classList.remove("active"));
        cat.classList.add("active");

        const selected = cat.dataset.cat;

        Array.from(commands).forEach(cmd => {
            if (selected === "all" || cmd.dataset.cat === selected) {
                cmd.style.display = "block";
            } else {
                cmd.style.display = "none";
            }
        });
    });
});

/* WYSZUKIWARKA */
document.querySelector(".search-box").addEventListener("input", e => {
    const value = e.target.value.toLowerCase();

    Array.from(commands).forEach(cmd => {
        const name = cmd.querySelector(".command-name").textContent.toLowerCase();
        const desc = cmd.querySelector(".command-desc").textContent.toLowerCase();

        cmd.style.display = (name.includes(value) || desc.includes(value)) ? "block" : "none";
    });
});
</script>

</body>
</html>
