<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodaj Bota – Okn't</title>

<style>
:root {
    --bg1: #000000;
    --bg2: #0d0d0d;
    --bg3: #1a1a1a;
    --glass: rgba(255,255,255,0.05);
    --glass-strong: rgba(255,255,255,0.12);
    --btn: #1b1b1b;
    --btn-hover: #2a2a2a;
}

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* TŁO */
body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* GLOW */
.bg-glow {
    position: fixed;
    width: 1200px;
    height: 1200px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    filter: blur(160px);
    animation: glowMove 18s infinite alternate ease-in-out;
    pointer-events: none;
    z-index: 0;
}

@keyframes glowMove {
    0% { transform: translate(-200px, -200px); opacity: 0.6; }
    50% { transform: translate(200px, -100px); opacity: 1; }
    100% { transform: translate(200px, 200px); opacity: 0.5; }
}

/* NOISE */
.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.08;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
}

/* GWIAZDY */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    opacity: 0.18;
    border-radius: 50%;
    animation: blink 3s infinite ease-in-out;
}

@keyframes blink {
    0% { opacity: 0.1; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-6px); }
    100% { opacity: 0.1; transform: translateY(0); }
}

/* KONTENER */
.container {
    position: relative;
    z-index: 5;
    max-width: 520px;
    padding: 45px;
    background: var(--glass);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 40px rgba(255,255,255,0.08);
    animation: fadeIn 1.2s ease, float 6s infinite ease-in-out;
    text-align: center;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}

/* LOGO W RAMCE */
.logo-img {
    width: 120px;
    height: 120px;
    margin: 0 auto 25px auto;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 35px rgba(255,255,255,0.18);
    animation: logoFloat 5s infinite ease-in-out;
}

@keyframes logoFloat {
    0% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
}

/* TEKST */
h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

p {
    font-size: 18px;
    opacity: 0.8;
    margin-bottom: 35px;
}

/* PRZYCISK — CIEMNY */
.btn {
    display: inline-block;
    padding: 16px 34px;
    background: var(--btn);
    color: white;
    text-decoration: none;
    font-size: 20px;
    border-radius: 14px;
    transition: 0.25s;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
}

.btn:hover {
    background: var(--btn-hover);
    transform: scale(1.06);
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="stars"></div>
<div class="noise"></div>

<div class="container">

    <!-- LOGO NA GÓRZE -->
    <img src="logo.png" class="logo-img">

    <h1>Okn't</h1>
    <p>Kliknij poniżej, aby dodać bota Okn't na swój serwer Discord.</p>

    <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1436469554766413854&permissions=8&integration_type=0&scope=bot">
        Dodaj na serwer
    </a>
</div>

<script>
/* GENERATOR GWIAZD */
const starsContainer = document.querySelector(".stars");
for (let i = 0; i < 90; i++) {
    const s = document.createElement("span");
    s.style.top = Math.random()*100 + "%";
    s.style.left = Math.random()*100 + "%";
    s.style.animationDuration = (2 + Math.random()*2) + "s";
    s.style.animationDelay = Math.random()*2 + "s";
    starsContainer.appendChild(s);
}
</script>

</body>
</html>
