<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Okn't</title>

<style>
:root {
    --bg1: #000000;
    --bg2: #111111;
    --bg3: #050505;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* RESPONSYWNOŚĆ – TELEFONY */
@media (max-width: 768px) {
    body {
        overflow: hidden;
    }
    .logo {
        width: 150px;
        height: 150px;
    }
}

/* BACKGROUND GLOW */
.bg-glow {
    position: fixed;
    width: 1100px;
    height: 1100px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    filter: blur(140px);
    animation: glowMove 16s infinite alternate ease-in-out;
    pointer-events: none;
    z-index: 0;
}

@keyframes glowMove {
    0% { transform: translate(-200px, -200px); }
    50% { transform: translate(200px, -100px); }
    100% { transform: translate(200px, 200px); }
}

/* STARS */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    opacity: 0.18;
    border-radius: 50%;
    animation: blink 3s infinite ease-in-out;
}

@keyframes blink {
    0% { opacity: 0.1; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-6px); }
    100% { opacity: 0.1; transform: translateY(0); }
}

/* LOGO */
.logo {
    position: relative;
    width: 200px;
    height: 200px;
    z-index: 5;
    cursor: pointer;
    animation: float 4s infinite ease-in-out;
}

.logo img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 40px rgba(255,255,255,0.25);
    transition: 0.25s;
}

.logo:hover img {
    transform: scale(1.05);
    box-shadow: 0 0 60px rgba(255,255,255,0.4);
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}

/* NOISE */
.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.08;
    z-index: 2;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='noStitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
}
</style>
</head>
<body>

<!-- autoplay fix -->
<audio id="bgm" src="music.mp3" autoplay loop muted></audio>

<div class="bg-glow"></div>
<div class="stars"></div>
<div class="noise"></div>

<!-- POPRAWIONY LINK (DZIAŁA LOKALNIE I NA GITHUBIE) -->
<a href="home/home.html" class="logo">
    <img src="logo.png">
</a>

<script>
/* STARS */
const starsContainer = document.querySelector(".stars");
for (let i = 0; i < 90; i++) {
    const s = document.createElement("span");
    s.style.top = Math.random()*100 + "%";
    s.style.left = Math.random()*100 + "%";
    s.style.animationDuration = (2 + Math.random()*2) + "s";
    s.style.animationDelay = Math.random()*2 + "s";
    starsContainer.appendChild(s);
}

/* MUSIC FIX */
setTimeout(() => {
    const bgm = document.getElementById("bgm");
    bgm.muted = false;
    bgm.volume = 0.45;
    bgm.play().catch(()=>{});
}, 500);
</script>

</body>
</html>
